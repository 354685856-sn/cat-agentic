name: Cat Codex desktop

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    paths:
      - 'apps/cat-codex/**'
      - '.github/workflows/cat-codex-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: apps/cat-codex

jobs:
  checks:
    name: Cat Codex checks
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cat-codex/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo check --manifest-path src-tauri/Cargo.toml
      - run: git diff --check

  release:
    name: Release ${{ matrix.platform }}
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x64
            runner: macos-13
          - platform: windows-x64
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/cat-codex/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Prepare official Codex sidecar
        shell: bash
        run: bash scripts/prepare-codex-sidecar.sh
      - name: Build and upload desktop release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/cat-codex
          tagName: ${{ github.ref_name }}
          releaseName: Cat Codex ${{ github.ref_name }}
          releaseBody: See the assets below for macOS and Windows installers.
          releaseDraft: true
          prerelease: false
